name: ai-discussion
on:
  schedule:
    # GitHub cron은 보통 10~90분 지각 → 타겟을 30분 앞당겨 06/18시대에 걸리게 함.
    # 2026-11-06 사용자 결정(하루 콜 1단계 450): 회의 하루 3번 → 2번 (장 시작 전 · 장 마감 후).
    # KST 05:37/17:37 = UTC 20:37/08:37  (옛 값: "37 20,2,8 * * *" — 낮 11:30 회의 제거)
    - cron: "37 20,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discuss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-genai pyyaml
      - name: AI 오케스트라 토론 (최대 175콜 = 회의 150 + 대신 읽기 25)
        # 계정(키) 추가 시: 여기 env에 GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }} 한 줄만 더 추가
        # (gemini_keys.py가 번호를 자동 인식하므로 discuss.py 코드는 건드릴 필요 없음)
        run: python discuss.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 버전2 스토리 (AI 번호표·자막 2~3콜 — 실패하면 규칙 배치로 계속)
        # story_build.py --ai: 사실 계산(코드) → AI는 번호·문장만 → 코드 검사 통과분만 story.json에.
        # 여기서 실패해도 다음 단계 publish.py가 규칙 배치로 docs/story.html을 만든다.
        run: python story_build.py --ai || echo "스토리 AI 단계 실패 — 규칙 배치로 진행"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      - name: 페이지 재생성 (토론 결과 반영)
        run: python publish.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 과거 데이터 자동 압축 및 경량화
        run: python archive_past.py
      - name: 커밋 & 푸시
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          # ⚠️ git add는 **없는 경로를 지정하면 exit 128로 죽는다.** 실험 파일(forecasts.jsonl 등)은
          # 첫 회의 전에는 존재하지 않아서, 목록에 그냥 넣었더니 커밋 단계에서 워크플로가 통째로
          # 실패했다(2026-08-05 19:56 KST 회의가 이걸로 날아감). 있는 것만 골라 add 한다.
          # `git add -A`로 뭉뚱그리지 않는 이유: 임시 CSV 같은 잡파일까지 커밋되기 때문.
          for f in docs discussions discussions.json exports key_usage.json trends.json logs                    retry_queue.json stream experience glossary.json                    forecasts.jsonl calibration.json themes.json graded.jsonl                    portfolio.json equity.jsonl trades.jsonl story.json; do
            [ -e "$f" ] && git add -A "$f"
          done
          true   # 마지막 [ -e ] 가 거짓이어도 스텝이 실패하지 않게
          git commit -m "토론: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "변경 없음"
          # 회의는 10~20분 걸린다. 그 사이 사람이 push하면 이 단계가 non-fast-forward로 죽고
          # **회의 결과가 통째로 버려진다**(2026-08-05 실제 발생 — 144콜을 쓴 회의를 날림).
          # 리베이스 후 재시도해서 결과를 지켜낸다. 우리 산출물은 생성파일이라 리베이스가 안전하다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 충돌 — 리베이스 후 재시도 ($i/5)"
            git fetch -q origin master
            # ⚠️ `git pull --rebase`만 쓰면 docs/index.html에서 반드시 충돌한다.
            # 이 파일은 **생성물**이라 시간별 publish 워크플로와 회의가 각각 다르게 만들어 낸다.
            # 충돌하면 `|| git rebase --abort`가 되돌려 놓고, 다음 push도 같은 이유로 실패해
            # 5번 돌다가 **회의 결과가 통째로 버려졌다**(2026-08-06 01:08 실측).
            # -X theirs = 리플레이되는 커밋(=우리 회의 결과)을 우선한다. 생성물은 회의 것이 최신이다.
            if ! git rebase origin/master -X theirs; then
              # 그래도 남는 충돌은 생성물만 우리 것으로 확정하고 진행한다.
              git checkout --theirs -- docs/index.html 2>/dev/null || true
              git add -- docs 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5회 재시도에도 push 실패"
          exit 1
