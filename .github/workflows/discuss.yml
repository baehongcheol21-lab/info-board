name: ai-discussion
on:
  schedule:
    # GitHub cron은 보통 10~90분 지각 → 타겟을 30분 앞당겨 06/12/18시대에 걸리게 함.
    # KST 05:30/11:30/17:30 = UTC 20:30/02:30/08:30
    - cron: "30 20,2,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discuss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-genai pyyaml
      - name: AI 오케스트라 토론 (최대 150콜)
        # 계정(키) 추가 시: 여기 env에 GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }} 한 줄만 더 추가
        # (gemini_keys.py가 번호를 자동 인식하므로 discuss.py 코드는 건드릴 필요 없음)
        run: python discuss.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 페이지 재생성 (토론 결과 반영)
        run: python publish.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 커밋 & 푸시
        run: |
          git config user.name "alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs discussions discussions.json exports key_usage.json trends.json logs retry_queue.json stream experience glossary.json
          git commit -m "토론: $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "변경 없음"
          # 회의는 10~20분 걸린다. 그 사이 사람이 push하면 이 단계가 non-fast-forward로 죽고
          # **회의 결과가 통째로 버려진다**(2026-08-05 실제 발생 — 144콜을 쓴 회의를 날림).
          # 리베이스 후 재시도해서 결과를 지켜낸다. 우리 산출물은 생성파일이라 리베이스가 안전하다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 충돌 — 리베이스 후 재시도 ($i/5)"
            git pull --rebase origin master || git rebase --abort
            sleep 5
          done
          echo "::error::5회 재시도에도 push 실패"
          exit 1
