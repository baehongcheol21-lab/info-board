name: fed-watch
# 안전시스템 1 — 연준 FOMC 성명서 감시 (버전2). 새 성명서가 있을 때만 AI가 돌고 결과를 커밋한다.
# 연준 발표 = 미국 동부 오후 2시 = 한국 새벽 3~4시. 깃허브 예약은 10~90분 지각하므로 두 번 확인.
on:
  schedule:
    - cron: "30 19 * * *"   # 한국 04:30 무렵
    - cron: "30 22 * * *"   # 한국 07:30 무렵
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 google-genai pydantic
      - name: 연준 감시
        run: python v2_fed/fed_watch.py
        env:
          FED_HOME: v2_fed
          FED_DATA: v2_fed/.data
          FED_OUT: v2_fed/briefs
          FED_CALL_LOG: v2_fed/.data/calls.jsonl
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      - name: 새 결과가 있을 때만 커밋 & 푸시
        run: |
          git config user.name "fed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add v2_fed/fomc_history.csv v2_fed/statements v2_fed/briefs
          if git diff --cached --quiet; then echo "새 성명서 없음 — 커밋 안 함"; exit 0; fi
          git commit -m "연준: 새 FOMC 성명서 $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 충돌 — 리베이스 후 재시도 ($i/5)"
            git pull --rebase origin master || git rebase --abort
            sleep 5
          done
          echo "::error::5회 재시도에도 push 실패"
          exit 1
